<!DOCTYPE html>

<html>
   
   <head>
     <tittle> Editor </tittle>

     <body>

       <div class="contenedor">
         <textarea onkeyup="actualizar()" class="texto_ingresado" id="texto_ingresado" placeholder="Escribe"></textarea>
         <iframe class="editor" id="editor" srcdoc="Resultados aqui"></iframe>
       </div>

       <style>
         body {
           padding: 0;
           margin: 0 auto;
           background-color: 273746;

         }

         .texto_ingresado {
           width: 45%;
           border: 4px solid black;
           margin:-top 2px;
           margin-left:10px;
           background-color: white;
          
       </style>

       <script>

          const actualizar = () →{
          const texto_ingresado = document.getElementById("texto_ingresado");
             const editor = document.getElementById("editor")
             editor.srcdoc = texto_ingresado.value;
          }
       </script>
       
       
     </body>
