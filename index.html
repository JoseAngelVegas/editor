<!DOCTYPE html>

<html>
   
   <head>
     <tittle> Editor </tittle>

   </head>

     <body>

       <div class="contenedor">
         <textarea onkeyup="actualizar()" class="texto_ingresado" id="texto_ingresado" placeholder="Escribe"></textarea>
         <iframe class="editor" id="editor" srcdoc="Resultados aqui"></iframe>
       </div>

       <style>
         body {
           padding: 0;
           margin: 0 auto;
           background-color: #273746;

         }

         .texto_ingresado {
           width: 45%;
           border: 4px solid black;
           margin:-top 2px;
           margin-left:10px;
           background-color: white;

         }

          .texto_ingresado::placeholder {

             position: relative;
             top: 10px;
             left: 10px;
          }

          .editor {
             margin-left: 18px;
             width: 50%;
             height: 120%;
             border: 4px solid black;
             margin-top: 10px;
             background-color: yellow;

          }
          
       </style>

       <script>

          const actualizar = () =>{
          const texto_ingresado = document.getElementById("texto_ingresado");
             const editor = document.getElementById("editor");
             editor.srcdoc = texto_ingresado.value;
          }
       </script>
       
     </body>

</html>
